services:
  postgres:
    image: postgres:16-alpine
    container_name: macau678-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: macau678
      POSTGRES_PASSWORD: macau678_dev
      POSTGRES_DB: macau678
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macau678 -d macau678"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
