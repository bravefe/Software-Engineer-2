services:
  db:
    image: postgres:16-alpine
    container_name: macau678-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macau678}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Password123}
      POSTGRES_DB: ${POSTGRES_DB:-macau678}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-macau678} -d ${POSTGRES_DB:-macau678}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: macau678-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-macau678}:${POSTGRES_PASSWORD:-Password123}@db:5432/${POSTGRES_DB:-macau678}?schema=public
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Password123!}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed"]

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: macau678-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      TZ: Asia/Bangkok
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-macau678}:${POSTGRES_PASSWORD:-Password123}@db:5432/${POSTGRES_DB:-macau678}?schema=public
    ports:
      - "3000:3000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: macau678-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  postgres_data:
