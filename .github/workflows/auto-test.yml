name: auto-test

on:
  pull_request:
    branches:
      - main
      - sprint-1
      - sprint-2
      - sprint-3
      - lab-5
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  client:
    name: Client tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm run test:client

  server:
    name: Server tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://macau678:Password123@localhost:5432/macau678?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL
        run: docker compose -f database/docker-compose.yml up -d --wait postgres

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run server tests
        run: npm run test:server

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://macau678:Password123@localhost:5432/macau678?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL
        run: docker compose -f database/docker-compose.yml up -d --wait postgres

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
